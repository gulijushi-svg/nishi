name: Release to Gitee

# 在 GitHub 发布 Release 后，自动在 Gitee 创建同名发行版（同标签、同标题、
# 同说明），并把 Release 的附件（如 APK）一并上传。
# 需要在仓库 Secrets 里配置 GITEE_TOKEN（Gitee 私人令牌，需 projects 权限）。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync
        required: true
        default: v1.0.0

jobs:
  sync-release:
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_API: https://gitee.com/api/v5/repos/gulijushi/nishi
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_NAME: ${{ github.event.release.name || format('泥石 {0}', inputs.tag) }}
      RELEASE_BODY: ${{ github.event.release.body || '' }}
      IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
      TARGET: ${{ github.event.release.target_commitish || 'main' }}
    steps:
      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets || echo "该 Release 没有附件，跳过下载"

      - name: Create Gitee release (skip if exists)
        id: gitee_release
        run: |
          set -e
          release_id=$(curl -s "$GITEE_API/releases/tags/$TAG?access_token=$GITEE_TOKEN" \
            | python3 -c "import sys, json; d = json.load(sys.stdin); print(d.get('id', ''))" 2>/dev/null || echo "")
          if [ -z "$release_id" ]; then
            release_id=$(curl -s -X POST "$GITEE_API/releases" \
              -d "access_token=$GITEE_TOKEN" \
              --data-urlencode "tag_name=$TAG" \
              --data-urlencode "name=${RELEASE_NAME:-$TAG}" \
              --data-urlencode "body=$RELEASE_BODY" \
              -d "prerelease=$IS_PRERELEASE" \
              -d "target_commitish=$TARGET" \
              | python3 -c "import sys, json; d = json.load(sys.stdin); print(d.get('id', ''))")
          fi
          if [ -z "$release_id" ]; then
            echo "创建或读取 Gitee 发行版失败，请检查 GITEE_TOKEN 是否有效、权限是否包含 projects"
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Gitee 发行版 id: $release_id"

      - name: Upload assets to Gitee release
        run: |
          set -e
          shopt -s nullglob
          files=(assets/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有附件需要上传"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "上传 $f"
            curl -s -X POST "$GITEE_API/releases/${{ steps.gitee_release.outputs.release_id }}/attach_files" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$f" > /dev/null
          done
          echo "附件上传完成"
