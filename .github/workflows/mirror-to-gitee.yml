name: Mirror to Gitee

# GitHub 是主仓库：每次 push（分支或标签）后，把全部代码镜像推送到 Gitee。
# 也可以在 Actions 页手动 Run workflow 立即同步一次。
# 需要在仓库 Secrets 里配置 GITEE_TOKEN（Gitee 私人令牌）。

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: mirror-to-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clone mirror from GitHub
        run: |
          git clone --mirror https://github.com/gulijushi-svg/nishi.git repo.git

      - name: Push mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          cd repo.git
          # GitHub 的 PR 引用不推到 Gitee
          git for-each-ref --format='%(refname)' refs/pull | while read -r ref; do
            git update-ref -d "$ref"
          done
          git push --mirror "https://gulijushi:${GITEE_TOKEN}@gitee.com/gulijushi/nishi.git"
